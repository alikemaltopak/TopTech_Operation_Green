<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TOPTECH Dashboard</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "var(--color-primary, #76c893)",
              "background-light": "var(--color-bg-light, #fdfcf0)",
              "background-dark": "var(--color-bg-dark, #1b2620)",
              "surface-light": "var(--color-surface-light, #f9f7e8)",
              "surface-dark": "var(--color-surface-dark, #25332b)",
              "border-light": "var(--color-border-light, #000000)",
              "border-dark": "var(--color-border-dark, #3a4d42)"
            },
            fontFamily: {
              "display": ["Manrope", "sans-serif"]
            },
            borderRadius: {
              "DEFAULT": "var(--radius-default, 0.5rem)",
              "lg": "var(--radius-lg, 1rem)",
              "xl": "var(--radius-xl, 1.5rem)",
              "2xl": "var(--radius-2xl, 2rem)",
              "full": "9999px"
            },
          },
        },
      }
    </script>
    <style>
      .glow-button {
        box-shadow: 0 0 20px rgba(19, 236, 91, 0.3);
      }
      body {
        min-height: 100dvh;
      }
      /* Hide scrollbar for Chrome, Safari and Opera */
      ::-webkit-scrollbar {
        display: none;
      }
      /* Hide scrollbar for IE, Edge and Firefox */
      body {
        -ms-overflow-style: none;  /* IE and Edge */
        scrollbar-width: none;  /* Firefox */
      }
      
      /* Texture styles - Minimalist and Modern */
      html.theme-textured body {
        background-image: 
          linear-gradient(to bottom, rgba(var(--bg-opacity-color, 0,0,0), var(--theme-bg-opacity, 0.85)), rgba(var(--bg-opacity-color, 0,0,0), var(--theme-bg-opacity, 0.95))), 
          var(--theme-img) !important;
        background-size: cover !important;
        background-position: center !important;
        background-attachment: fixed !important;
      }

      /* Toned down buttons */
      html.theme-textured .bg-primary {
         filter: contrast(1.05) brightness(1.05);
      }

      /* Text readability enhancements for main page text on raw background */
      html.theme-textured h1, 
      html.theme-textured h2, 
      html.theme-textured h3,
      html.theme-textured p,
      html.theme-textured span {
        text-shadow: 0px 2px 5px rgba(0,0,0,0.7), 0px 0px 2px rgba(0,0,0,0.5);
      }

      /* Keep text crisp in light themes */
      html:not(.dark).theme-textured h1,
      html:not(.dark).theme-textured h2,
      html:not(.dark).theme-textured h3,
      html:not(.dark).theme-textured p,
      html:not(.dark).theme-textured span {
        text-shadow: 0px 0px 4px rgba(255,255,255,1), 0px 1px 2px rgba(255,255,255,0.8);
      }

      /* REMOVE text-shadow from icons, modals, and inside solid cards */
      html.theme-textured .material-symbols-outlined,
      html.theme-textured .bg-surface-light *,
      html.theme-textured .bg-surface-dark *,
      html.theme-textured .dark\:bg-surface-dark *,
      html.theme-textured .bg-slate-100 *,
      html.theme-textured .dark\:bg-background-dark *,
      html.theme-textured .dark\:bg-background-dark\/50 * {
        text-shadow: none !important;
      }

      /* Add slight translucency to surface elements to show texture underneath */
      html.theme-textured .bg-surface-light {
        background-color: color-mix(in srgb, var(--color-surface-light) 85%, transparent) !important;
        backdrop-filter: blur(12px);
      }
      
      html.theme-textured .bg-surface-dark,
      html.theme-textured .dark\:bg-surface-dark {
        background-color: color-mix(in srgb, var(--color-surface-dark) 85%, transparent) !important;
        backdrop-filter: blur(12px);
      }
      
      html.theme-textured .dark\:bg-background-dark\/30 {
        background-color: color-mix(in srgb, var(--color-bg-dark) 40%, transparent) !important;
        backdrop-filter: blur(8px);
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-white transition-colors duration-300 antialiased">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
